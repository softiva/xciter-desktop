# Arch Linux package (.pkg.tar.zst), x86_64. Tauri has no pacman bundler, so this builds the .deb on Ubuntu
# 22.04 and repackages it with packaging/arch/PKGBUILD in an Arch container: the same binary as the .deb.
# The package is checked with namcap and installed in a clean Arch container before it is released.
name: Linux pacman

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml

  version:
    uses: ./.github/workflows/_version.yml

  deb:
    name: Build the .deb to repackage
    needs: [gate, version]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-key: linux-release

      - name: Build the .deb
        env:
          XCITER_DESKTOP_KEY: ${{ secrets.XCITER_DESKTOP_KEY }}
        run: |
          if [ -z "$XCITER_DESKTOP_KEY" ]; then echo "::error::The XCITER_DESKTOP_KEY secret is not set"; exit 1; fi
          cd app && ../node_modules/.bin/tauri build --bundles deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacman-input-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package for Arch
    needs: [version, deb]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git namcap pacman-contrib

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacman-input-deb
          path: input

      - name: makepkg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD LICENSE "$work/"
          cp input/*.deb "$work/xciter.deb"
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" "$work/PKGBUILD"
          chown -R builder "$work"
          cd "$work"
          su builder -c 'updpkgsums && makepkg --nodeps --noconfirm --cleanbuild'
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst | tee namcap.txt
          if grep -q ' E: ' namcap.txt; then echo "::error::namcap reported errors"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-pacman
          path: dist/
          retention-days: 14
          if-no-files-found: error

  install-test:
    name: Install on Arch
    needs: [version, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-pacman

      - name: Install and check
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          pacman -Qi xciter-bin
          bin=$(pacman -Qlq xciter-bin | grep -m1 '/bin/.')
          echo "binary: $bin"
          if ldd "$bin" | grep 'not found'; then echo "::error::missing libraries"; exit 1; fi

  publish:
    name: Upload to the release
    if: needs.version.outputs.is_tag == 'true'
    needs: [version, install-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-pacman
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/release-upload "$TAG" dist/*
