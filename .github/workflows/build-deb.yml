# Debian/Ubuntu package (.deb), x86_64. Built on Ubuntu 22.04 so its glibc baseline covers Debian 12,
# Ubuntu 22.04 and newer; installed in clean Debian 12 and Ubuntu 24.04 containers before it is released.
name: Linux .deb

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml

  version:
    uses: ./.github/workflows/_version.yml

  build:
    name: Build
    needs: [gate, version]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-key: linux-release

      - name: Build the .deb
        env:
          XCITER_DESKTOP_KEY: ${{ secrets.XCITER_DESKTOP_KEY }}
        run: |
          if [ -z "$XCITER_DESKTOP_KEY" ]; then echo "::error::The XCITER_DESKTOP_KEY secret is not set"; exit 1; fi
          cd app && ../node_modules/.bin/tauri build --bundles deb -- --locked

      - name: Check the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb dist/
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          echo "package: $(dpkg-deb -f "$deb" Package)"
          case "$(dpkg-deb -f "$deb" Version)" in
            "$VERSION"*) ;;
            *) echo "::error::package version $(dpkg-deb -f "$deb" Version) is not $VERSION"; exit 1 ;;
          esac
          dpkg-deb -f "$deb" Depends | grep -q libasound2 || { echo "::error::ALSA dependency missing"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-deb
          path: dist/
          retention-days: 14
          if-no-files-found: error

  install-test:
    name: Install on ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-deb

      - name: Install and check
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          deb=$(ls ./*.deb)
          name=$(dpkg-deb -f "$deb" Package)
          apt-get install -y "$deb"
          dpkg -s "$name"
          bin=$(dpkg -L "$name" | grep -m1 '/bin/')
          [ -n "$bin" ] || { echo "::error::$name installs no binary"; exit 1; }
          echo "binary: $bin"
          if ldd "$bin" | grep 'not found'; then echo "::error::missing libraries"; exit 1; fi

  publish:
    name: Upload to the release
    if: needs.version.outputs.is_tag == 'true'
    needs: [version, install-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-deb
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/release-upload "$TAG" dist/*
