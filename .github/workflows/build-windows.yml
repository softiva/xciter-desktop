# Windows installers, x64: the NSIS setup .exe always, and the .msi for stable versions (WiX rejects
# pre-release text in versions, see scripts/tag-version). The app and both installers are signed with the
# code-signing certificate and timestamped, then installed and uninstalled silently on the runner.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: pwsh

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml

  version:
    uses: ./.github/workflows/_version.yml

  build:
    name: Build and sign
    needs: [gate, version]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          cache-key: windows-release

      - id: cert
        uses: ./.github/actions/sign-windows
        with:
          pfx-base64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          pfx-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}

      - name: Build and sign
        env:
          XCITER_DESKTOP_KEY: ${{ secrets.XCITER_DESKTOP_KEY }}
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          MSI: ${{ needs.version.outputs.msi }}
        run: |
          if (-not $env:XCITER_DESKTOP_KEY) { Write-Output "::error::The XCITER_DESKTOP_KEY secret is not set"; exit 1 }
          $bundles = if ($env:MSI -eq 'true') { 'nsis,msi' } else { 'nsis' }
          $config = Join-Path $env:RUNNER_TEMP 'signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $env:THUMBPRINT } } } | ConvertTo-Json -Depth 4 | Set-Content $config
          Set-Location app
          npx --no-install tauri build --bundles $bundles --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the signatures
        env:
          MSI: ${{ needs.version.outputs.msi }}
        run: |
          $files = @('target/release/xciter.exe') + (Get-ChildItem target/release/bundle/nsis/*.exe).FullName
          if ($env:MSI -eq 'true') { $files += (Get-ChildItem target/release/bundle/msi/*.msi).FullName }
          $bad = 0
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            Write-Output "$file : $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Output "::error::$file is not validly signed"; $bad = 1 }
            if (-not $sig.TimeStamperCertificate) { Write-Output "::error::$file has no timestamp"; $bad = 1 }
          }
          exit $bad

      - name: Install and uninstall silently
        env:
          MSI: ${{ needs.version.outputs.msi }}
        run: |
          $setup = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter xciter.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::the NSIS installer did not install xciter.exe"; exit 1 }
          Write-Output "installed: $($exe.FullName)"
          $uninstall = Join-Path $exe.DirectoryName 'uninstall.exe'
          if (Test-Path $uninstall) { Start-Process $uninstall -ArgumentList '/S' -Wait }
          if ($env:MSI -eq 'true') {
            $msi = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
            $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Output "::error::msiexec install failed ($($p.ExitCode))"; exit 1 }
            $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Output "::error::msiexec uninstall failed ($($p.ExitCode))"; exit 1 }
          }

      - name: Collect
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          if (Test-Path target/release/bundle/msi) { Copy-Item target/release/bundle/msi/*.msi dist/ }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-windows
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Upload to the release
    if: needs.version.outputs.is_tag == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xciter-${{ needs.version.outputs.label }}-windows
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/release-upload "$TAG" dist/*
